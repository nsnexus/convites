name = "ns-convites"
pages_build_output_dir = "public"
compatibility_date = "2026-11-01"

# Fotos dos clientes e vídeos dos modelos ficam neste bucket do R2.
# Crie com:  npx wrangler r2 bucket create ns-convites
[[r2_buckets]]
binding = "ARQUIVOS"
bucket_name = "ns-convites"

# Segredos (não coloque aqui): configure no painel da Cloudflare ou com
#   npx wrangler pages secret put SUPABASE_SERVICE_ROLE_KEY
#   npx wrangler pages secret put WEBHOOK_SECRET
#   npx wrangler pages secret put ADMIN_SENHA
[vars]
SUPABASE_URL = "https://SEU-PROJETO.supabase.co"
LIBERAR_SEM_PAGAMENTO = "0"
# Opcional: domínio próprio ligado ao bucket (ex.: https://arquivos.seudominio.com.br)
# ARQUIVOS_URL = ""
